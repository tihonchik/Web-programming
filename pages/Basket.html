<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/variables/primitives.css" />
    <link rel="stylesheet" href="/styles/index.css" />
    <link rel="stylesheet" href="/variables/desktop.css" />
    <link rel="stylesheet" href="/variables/tablet.css" />
    <link rel="stylesheet" href="/variables/mobile.css" />
    <link rel="stylesheet" href="/variables/fonts.css" />
    <link rel="stylesheet" href="/styles/animation.css" />
    <link rel="stylesheet" href="/styles/catalog.css" />
    <title>Catalog</title>
  </head>
  <body>
    <my-header class="header"></my-header>

    <main class="catalog-main top-block">
      <div class="catalog_search">
        <input class="catalog_input H3" type="text" />
        <select name="type" id="type" class="catalog_select H4">
          <option value="title">title</option>
          <option value="description">description</option>
          <option value="coast">coast</option>
          <option value="coast">volume</option>
        </select>
        <select name="sort" id="sort" class="catalog_sort H4">
          <option value="title">title</option>
          <option value="description">description</option>
          <option value="coast">coast</option>
          <option value="coast">volume</option>
        </select>
        <select name="sortType" id="sortType" class="catalog_sort_type H4">
          <option value="asc">sort ASC</option>
          <option value="desc">sort DESC</option>
        </select>
        <div class="catalog_filter H4"></div>
        <p class="H3 Sum"></p>
        <button class="button Buy">Buy</button>
      </div>
      <div class="catalog-grid basket"></div>
      <div class="buttons">
        <button class="left button">left</button>
        <button class="right button">right</button>
      </div>
    </main>

    <my-footer class="footer"></my-footer>
  </body>
  <script src="/components/MyHeader.js"></script>
  <script src="/components/MyFooter.js"></script>
  <script src="/js/basket.js" type="module"></script>
</html>
