  <body>
    <my-header class="header"></my-header>

    <main class="catalog-main top-block">
      <div class="buttons">
        <button class="reset-button button">reset</button>
        <button class="first-button button">map * 2</button>
        <button class="second-button button">filter where coast > 1000</button>
        <button class="third-button button">soart by coast asc</button>
        <button class="fourth-button button">soart by coast desc</button>
        <button class="fiveth-button button">delete last</button>
        <button class="sixth-button button">add new</button>
        <button class="seventh-button button">concat</button>
        <button class="eight-button button">find</button>
        <button class="nineth-button button">reverse</button>
        <button class="tenth-button button">Перемешать</button>
      </div>
      <div class="catalog_search">
        <input class="catalog_input H3" type="text" />
        <select name="type" id="type" class="catalog_secelt H4">
          <option value="title">title</option>
          <option value="description">description</option>
          <option value="coast">coast</option>
          <option value="coast">volume</option>
        </select>
      </div>
      <div class="catalog-grid"></div>
    </main>

    <my-footer class="footer"></my-footer>
  </body>
