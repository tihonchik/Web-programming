<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/variables/primitives.css" />
    <link rel="stylesheet" href="/styles/index.css" />
    <link rel="stylesheet" href="/variables/desktop.css" />
    <link rel="stylesheet" href="/variables/tablet.css" />
    <link rel="stylesheet" href="/variables/mobile.css" />
    <link rel="stylesheet" href="/variables/fonts.css" />
    <link rel="stylesheet" href="/styles/animation.css" />
    <link rel="stylesheet" href="/styles/login.css" />
    <title>Login</title>
  </head>
  <body>
    <my-header class="header"></my-header>

    <main class="login-main top-block">
      <div class="login-container">
        <div class="login-card">
          <div class="login-header">
            <h1 class="login-title H2">Welcome Back</h1>
            <p class="login-subtitle Text">Sign in to your account</p>
          </div>

          <form class="login-form" id="loginForm">
            <div class="form-group">
              <label for="email" class="form-label Smalltext">Email</label>
              <input
                type="email"
                id="email"
                class="form-input Text"
                placeholder="Enter your email"
              />
              <span class="error-message" id="emailError"></span>
            </div>

            <div class="form-group">
              <label for="password" class="form-label Smalltext"
                >Password</label
              >
              <div class="password-wrapper">
                <input
                  type="password"
                  id="password"
                  class="form-input Text"
                  placeholder="Enter your password"
                />
              </div>
              <span class="error-message" id="passwordError"></span>
            </div>
            <span class="error-message" id="loginError"></span>
            <button type="submit" class="login-button button Smalltext">
              Sign In
            </button>
          </form>
          <div class="login-footer">
            <p class="Smalltext">
              Don't have an account?
              <a href="/pages/register.html" class="register-link">Sign up</a>
            </p>
          </div>
        </div>
      </div>
    </main>

    <my-footer class="footer top-block"></my-footer>
  </body>
  <script src="/components/MyHeader.js"></script>
  <script src="/components/MyFooter.js"></script>
  <script src="/js/login.js" type="module"></script>
</html>
