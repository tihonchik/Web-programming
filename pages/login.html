<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/preLoader.css" />
    <script src="../components/preLoader.js" type="module"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../variables/primitives.css" />
    <link rel="stylesheet" href="../styles/index.css" />
    <link rel="stylesheet" href="../variables/desktop.css" />
    <link rel="stylesheet" href="../variables/tablet.css" />
    <link rel="stylesheet" href="../variables/mobile.css" />
    <link rel="stylesheet" href="../variables/fonts.css" />
    <link rel="stylesheet" href="../styles/animation.css" />
    <link rel="stylesheet" href="../styles/login.css" />
    <link rel="stylesheet" href="../variables/dark-theme.css" />
    <title>Login</title>
    <link rel="icon" type="image/png" href="../static/favicon.png?" />
  </head>
  <body>
    <pre-loader></pre-loader>
    <my-header class="header"></my-header>
    <main class="login-main top-block">
      <div class="login-container">
        <div class="login-card">
          <div class="login-header">
            <h1 class="login-title H2" data-i18n="login.title">Welcome Back</h1>
            <p class="login-subtitle Text" data-i18n="login.subtitle">
              Sign in to your account
            </p>
          </div>

          <form class="login-form" id="loginForm">
            <div class="form-group">
              <label
                for="email"
                class="form-label Smalltext"
                data-i18n="login.email"
                >Email</label
              >
              <input
                type="email"
                id="email"
                class="form-input Text"
                placeholder="Enter your email"
                data-i18n-placeholder="login.emailPlaceholder"
              />
              <span class="error-message" id="emailError"></span>
            </div>

            <div class="form-group">
              <label
                for="password"
                class="form-label Smalltext"
                data-i18n="login.password"
                >Password</label
              >
              <div class="password-wrapper">
                <input
                  type="password"
                  id="password"
                  class="form-input Text"
                  placeholder="Enter your password"
                  data-i18n-placeholder="login.passwordPlaceholder"
                />
              </div>
              <span class="error-message" id="passwordError"></span>
            </div>
            <span class="error-message" id="loginError"></span>
            <button
              type="submit"
              class="login-button button Smalltext"
              data-i18n="login.signIn"
            >
              Sign In
            </button>
          </form>
          <div class="login-footer">
            <p class="Smalltext">
              <span data-i18n="login.noAccount">Don't have an account?</span>
              <a
                href="../pages/register.html"
                class="register-link"
                data-i18n="login.signUp"
                >Sign up</a
              >
            </p>
          </div>
        </div>
      </div>
    </main>

    <my-footer class="footer top-block"></my-footer>
  </body>
  <script src="../components/MyHeader.js" type="module"></script>
  <script src="../components/MyFooter.js"></script>
  <script src="../js/login.js" type="module"></script>
</html>
